name: Run Drizzle Migrations

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Migrations
        env:
          # Use Supabase Direct Connection (Port 5432) for running migrations
          DIRECT_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npx drizzle-kit migrate
